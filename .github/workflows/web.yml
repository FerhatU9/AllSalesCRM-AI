name: Web workspace checks
permissions:
  contents: read
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Compile Next.js production build with synthetic settings
        env:
          AUTH0_DOMAIN: example.eu.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client
          AUTH0_CLIENT_SECRET: ci-placeholder-secret
          APP_BASE_URL: http://localhost:3000
          AUTH0_AUDIENCE: https://api.allsales.local
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
        run: AUTH0_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')" npm run build
