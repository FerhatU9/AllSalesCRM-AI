name: PostgreSQL integration
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allsales_ci
          POSTGRES_PASSWORD: ci-only-synthetic
          POSTGRES_DB: allsales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allsales_ci -d allsales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://allsales_ci:ci-only-synthetic@127.0.0.1:5432/allsales_test
      DATABASE_URL: postgresql+psycopg://allsales_ci:ci-only-synthetic@127.0.0.1:5432/allsales_test
      ALLSALES_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify PostgreSQL migrations and tenant boundaries
        run: python -m pytest -q tests/test_postgres_integration.py
