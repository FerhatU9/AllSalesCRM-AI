name: Prepare frontend dependency lockfile

on:
  pull_request:
    paths:
      - 'web/package.json'
      - '.github/workflows/prepare-web-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile using registry resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build Next.js
        env:
          AUTH0_DOMAIN: example.eu.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client
          AUTH0_CLIENT_SECRET: ci-placeholder-secret
          APP_BASE_URL: http://localhost:3000
          AUTH0_AUDIENCE: https://api.allsales.local
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
        run: AUTH0_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')" npm run build
      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
