name: Prepare frontend dependency lockfile

on:
  push:
    branches: [maintenance/reproducible-web-dependencies]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile using registry resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build Next.js
        env:
          AUTH0_DOMAIN: example.eu.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client
          AUTH0_CLIENT_SECRET: ci-placeholder-secret
          APP_BASE_URL: http://localhost:3000
          AUTH0_AUDIENCE: https://api.allsales.local
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
        run: AUTH0_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')" npm run build
      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
      - name: Commit verified lockfile to development branch
        if: github.ref == 'refs/heads/maintenance/reproducible-web-dependencies'
        working-directory: .
        run: |
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Lock verified frontend dependency versions"
            git push origin HEAD:maintenance/reproducible-web-dependencies
          fi
